<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIVOS // Área do Candidato — Acesso ao Painel</title>
  <meta name="description" content="Acesse seu Sistema Operacional de Estudos CRIVOS com seu e-mail e chave de acesso tática.">
  
  <!-- Favicon oficial da CRIVOS -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    (function() {
      try {
        var t = localStorage.getItem('crivos_theme') || localStorage.getItem('crivos_web_theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch(e) {}
    })();
  </script>

  <!-- Biblioteca de Conexão com Servidor -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-primary: #F4F4F0;
      --bg-surface: #FFFFFF;
      --bg-elevated: #EAEAE4;
      --bg-dark-block: #111111;
      --text-primary: #111111;
      --text-secondary: #383838;
      --text-muted: #666666;
      --text-on-dark: #F4F4F0;
      --accent-red: #D92B2B;
      --accent-red-hover: #B91C1C;
      --accent-blue: #1D4ED8;
      --accent-green: #15803D;
      --border-color: #111111;
      --border-subtle: rgba(17, 17, 17, 0.15);
      --shadow-sm: 2px 2px 0px #111111;
      --shadow-hard: 4px 4px 0px #111111;
      --shadow-lg: 8px 8px 0px #111111;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg-primary: #0B0C0E;
      --bg-surface: #131519;
      --bg-elevated: #1B1E24;
      --bg-dark-block: #070809;
      --text-primary: #F2F2EE;
      --text-secondary: #B0B6C3;
      --text-muted: #767E8F;
      --text-on-dark: #F2F2EE;
      --accent-red: #E53935;
      --accent-red-hover: #D32F2F;
      --accent-blue: #3B82F6;
      --accent-green: #22C55E;
      --border-color: #2C313C;
      --border-subtle: rgba(242, 242, 238, 0.1);
      --shadow-sm: 2px 2px 0px #000000;
      --shadow-hard: 4px 4px 0px #000000;
      --shadow-lg: 8px 8px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* TOPBAR INSTITUCIONAL */
    .topbar {
      border-bottom: 2px solid var(--border-color);
      background: var(--bg-surface);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topbar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.25rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-sq {
      width: 14px;
      height: 14px;
      background: var(--accent-red);
      border: 1px solid var(--border-color);
      display: inline-block;
      flex-shrink: 0;
      aspect-ratio: 1/1;
    }

    .brand-name {
      font-family: var(--font-sans);
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .brand-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      border-left: 1px solid var(--border-subtle);
      padding-left: 0.6rem;
      margin-left: 0.2rem;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .nav-link-btn {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-transform: uppercase;
    }

    .nav-link-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hard);
    }

    /* CONTAINER PRINCIPAL */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem;
    }

    .login-card {
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 460px;
      padding: 2.25rem 2rem;
      position: relative;
    }

    .login-brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .login-brand-sq {
      width: 22px;
      height: 22px;
      background: var(--accent-red);
      border: 1px solid var(--border-color);
      flex-shrink: 0;
      aspect-ratio: 1/1;
    }

    .login-brand-title {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .login-brand-subtitle {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .login-intro {
      font-size: 0.88rem;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.75rem 0.85rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-red);
      box-shadow: 2px 2px 0px var(--accent-red);
    }

    .login-feedback {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      margin-bottom: 1.25rem;
      line-height: 1.45;
      display: none;
    }

    .login-feedback.error {
      display: block;
      background: rgba(217, 43, 43, 0.08);
      border: 1px solid var(--accent-red);
      border-left: 4px solid var(--accent-red);
      color: var(--accent-red);
      padding: 0.65rem 0.85rem;
    }

    .login-feedback.success {
      display: block;
      background: rgba(21, 128, 61, 0.08);
      border: 1px solid var(--accent-green);
      border-left: 4px solid var(--accent-green);
      color: var(--accent-green);
      padding: 0.65rem 0.85rem;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-red);
      color: #FFFFFF;
      border: 2px solid var(--border-color);
      padding: 0.85rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--accent-red-hover);
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hard);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* BOTAO LOGIN GOOGLE & DIVISOR TÁTICO */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.12s ease;
      margin-bottom: 1.25rem;
    }

    .btn-google:hover:not(:disabled) {
      background: var(--bg-elevated);
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hard);
    }

    .btn-google:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    .btn-google:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }

    .auth-divider span {
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .login-footer-actions {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .login-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .login-link-secondary {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
    }

    .login-link-secondary:hover {
      color: var(--accent-red);
    }

    .demo-callout-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-primary);
      text-decoration: none;
      background: var(--bg-elevated);
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      text-align: center;
      text-transform: uppercase;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .demo-callout-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-hard);
    }

    /* BOTAO FLUTUANTE DE TEMA */
    .theme-floating-btn {
      position: fixed !important;
      bottom: 1.75rem !important;
      right: 1.75rem !important;
      z-index: 99999 !important;
      width: 52px;
      height: 52px;
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease;
      user-select: none;
    }

    .theme-floating-btn:hover {
      transform: translate(-3px, -3px) scale(1.06);
      box-shadow: 6px 6px 0px var(--border-color);
    }

    .theme-floating-btn:active {
      transform: translate(2px, 2px) scale(0.96);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .theme-icon-wrap {
      font-size: 1.25rem;
      line-height: 1;
      display: inline-block;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* CANVAS DE COORDENADAS INTERATIVO */
    #coord-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      display: block;
    }

    .main-content {
      position: relative;
      z-index: 1;
    }

    /* FOOTER */
    .footer {
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
      padding: 1.25rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- CANVAS DE COORDENADAS INTERATIVO DE FUNDO -->
  <canvas id="coord-canvas"></canvas>

  <!-- TOPBAR INSTITUCIONAL -->
  <header class="topbar">
    <div class="topbar-container">
      <a href="/" class="brand">
        <span class="brand-sq"></span>
        <span class="brand-name">CRIVOS</span>
        <span class="brand-tag">// v26.2</span>
      </a>

      <div class="nav-actions">
        <a href="/" class="nav-link-btn">← INÍCIO</a>
        <a href="https://demo.crivos.me" target="_blank" rel="noopener noreferrer" class="nav-link-btn" style="background:var(--bg-elevated)">DEMO AO VIVO ↗</a>
      </div>
    </div>
  </header>

  <!-- FORMULÁRIO DE LOGIN -->
  <main class="login-container">
    <div class="login-card">
      <div class="login-brand-header">
        <div class="login-brand-sq" aria-hidden="true"></div>
        <div>
          <div class="login-brand-title">PORTAL DO CANDIDATO</div>
        </div>
      </div>

      <button type="button" id="btn-google-login" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0;">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.15C3.27 21.36 7.36 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.2 0 10.04 0 12s.46 3.8 1.28 5.42l4-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.27 2.64 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>ENTRAR COM O GOOGLE</span>
      </button>

      <div class="auth-divider">
        <span>OU COM CHAVE DE ACESSO</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email" class="form-label">E-MAIL DO CANDIDATO</label>
          <input type="email" id="login-email" class="form-input" required placeholder="candidato@exemplo.com" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">CHAVE DE ACESSO (SENHA TÁTICA)</label>
          <input type="password" id="login-password" class="form-input" required placeholder="••••••••••••" autocomplete="current-password">
        </div>

        <div id="login-feedback" class="login-feedback"></div>

        <button type="submit" id="btn-submit-login" class="btn-submit">
          <span>[ ENTRAR NO PAINEL ]</span>
          <span>→</span>
        </button>

        <div style="text-align:center;margin-top:16px;">
          <a href="#" id="link-forgot" class="login-link-secondary">Esqueceu sua chave de acesso?</a>
        </div>
      </form>
    </div>
  </main>

  <!-- BOTAO FLUTUANTE DE TEMA (DIRETRIZ OFICIAL CRIVOS-WEB) -->
  <button class="theme-floating-btn" id="theme-toggle" type="button" title="Alternar Modo Claro / Escuro" aria-label="Alternar Tema">
    <span class="theme-icon-wrap" id="theme-icon">◐</span>
  </button>

  <script>
    // Inicialização da Autenticação do Aluno
    const SUPABASE_URL = 'https://dmmtmfjlieqeqwlhtgrr.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_pRdjFhU4VWrjVOOSUcNB5Q_9ZnJwFNw';
    
    let sbClient = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch(e) {
      console.warn('Erro ao conectar ao servidor:', e);
    }

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('btn-submit-login');
    const feedback = document.getElementById('login-feedback');
    const linkForgot = document.getElementById('link-forgot');

    function showFeedback(msg, isError = true) {
      feedback.style.display = 'block';
      feedback.className = 'login-feedback ' + (isError ? 'error' : 'success');
      feedback.textContent = (isError ? '⚠ ' : '✓ ') + msg;
    }

    try {
      const qParams = new URLSearchParams(window.location.search);
      const qMsg = qParams.get('msg');
      if (qMsg) {
        showFeedback(qMsg, false);
      }
    } catch(e) {}

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) {
        showFeedback('Por favor, informe seu e-mail e chave de acesso.');
        return;
      }

      if (!sbClient) {
        showFeedback('Falha na conexão com o servidor. Tente novamente em instantes.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '[ AUTENTICANDO NO SISTEMA... ]';
      feedback.style.display = 'none';

      try {
        const { data, error } = await sbClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) throw error;

        if (data && data.session) {
          showFeedback('Autenticação autorizada! Carregando seu ecossistema...', false);
          
          try {
            localStorage.setItem('crivos_user_email', email);
          } catch(e) {}

          // Redireciona diretamente para o painel com token de acesso para auto-login cross-domain
          setTimeout(() => {
            const redirectUrl = `https://app.crivos.me/#access_token=${encodeURIComponent(data.session.access_token)}&refresh_token=${encodeURIComponent(data.session.refresh_token)}&type=recovery`;
            window.location.href = redirectUrl;
          }, 500);
        }
      } catch (err) {
        console.error(err);
        showFeedback(err.message === 'Invalid login credentials' 
          ? 'Chave de acesso ou e-mail incorretos. Verifique suas credenciais.' 
          : (err.message || 'Falha na autenticação. Verifique suas credenciais.'));
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>[ ENTRAR NO PAINEL ]</span><span>→</span>';
      }
    });

    linkForgot.addEventListener('click', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim() || prompt('Informe seu e-mail cadastrado para enviarmos instruções de recuperação:');
      if (!email) return;

      if (!sbClient) {
        alert('Serviço indisponível no momento.');
        return;
      }

      try {
        const { error } = await sbClient.auth.resetPasswordForEmail(email);
        if (error) throw error;
        alert('✓ Instruções de redefinição de chave foram enviadas para ' + email);
      } catch (err) {
        alert('Erro ao solicitar redefinição: ' + (err.message || 'Falha no envio.'));
      }
    });

    const googleBtn = document.getElementById('btn-google-login');
    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        if (!sbClient) {
          showFeedback('Falha na conexão com o servidor. Tente novamente em instantes.');
          return;
        }
        try {
          googleBtn.disabled = true;
          googleBtn.innerHTML = '<span>[ CONECTANDO AO GOOGLE... ]</span>';
          const { error } = await sbClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: 'https://app.crivos.me'
            }
          });
          if (error) throw error;
        } catch (err) {
          console.error('[OAuth Google]', err);
          showFeedback('Falha ao conectar com o Google: ' + (err.message || 'Erro inesperado.'));
          googleBtn.disabled = false;
          googleBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0;">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.28v3.15C3.27 21.36 7.36 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.28C.46 8.2 0 10.04 0 12s.46 3.8 1.28 5.42l4-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.27 2.64 1.28 6.58l4 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>ENTRAR COM O GOOGLE</span>
          `;
        }
      });
    }

    // Theme toggle sincronizado
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');

    function updateThemeIcon(isDark) {
      if (themeIcon) {
        themeIcon.textContent = isDark ? '◑' : '◐';
      }
    }

    const savedTheme = localStorage.getItem('crivos_theme') || localStorage.getItem('crivos_web_theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      updateThemeIcon(true);
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        if (next === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        localStorage.setItem('crivos_theme', next);
        localStorage.setItem('crivos_web_theme', next);
        updateThemeIcon(next === 'dark');

        if (themeIcon) {
          themeIcon.style.transform = 'rotate(180deg)';
          setTimeout(() => { themeIcon.style.transform = 'none'; }, 350);
        }
      });
    }

    /* ------------------------------------------------------------------
       CANVAS DE COORDENADAS INTERATIVO (RETINA + TOUCH + PULSO AUTÔNOMO)
       ------------------------------------------------------------------ */
    (function initCoordCanvas() {
      const canvas = document.getElementById('coord-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      const pointer = { x: -9999, y: -9999, active: false };
      let pulseAngle = 0;

      function setSize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      let nodes = [];
      function populateNodes() {
        setSize();
        nodes = [];
        const isMobile = width < 768;
        const densityDivisor = isMobile ? 12000 : 16000;
        const count = Math.max(28, Math.min(75, Math.floor((width * height) / densityDivisor)));
        const speed = isMobile ? 0.32 : 0.44;

        for (let i = 0; i < count; i++) {
          const isMajor = Math.random() < 0.22;
          nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * speed,
            vy: (Math.random() - 0.5) * speed,
            size: isMajor ? 3.5 : 2.2,
            isMajor: isMajor
          });
        }
      }

      populateNodes();

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(populateNodes, 120);
      });

      window.addEventListener('mousemove', e => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;
        pointer.active = true;
      }, { passive: true });

      window.addEventListener('mouseleave', () => {
        pointer.active = false;
      }, { passive: true });

      window.addEventListener('touchstart', e => {
        if (e.touches && e.touches[0]) {
          pointer.x = e.touches[0].clientX;
          pointer.y = e.touches[0].clientY;
          pointer.active = true;
        }
      }, { passive: true });

      window.addEventListener('touchmove', e => {
        if (e.touches && e.touches[0]) {
          pointer.x = e.touches[0].clientX;
          pointer.y = e.touches[0].clientY;
          pointer.active = true;
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        pointer.active = false;
      }, { passive: true });

      function draw() {
        ctx.clearRect(0, 0, width, height);
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const isMobile = width < 768;

        const gridStroke = isDark ? 'rgba(242, 242, 238, 0.065)' : 'rgba(17, 17, 17, 0.08)';
        const nodeFill = isDark ? 'rgba(242, 242, 238, 0.42)' : 'rgba(17, 17, 17, 0.36)';
        const majorNodeFill = '#D92B2B';

        const step = isMobile ? 44 : 64;
        ctx.strokeStyle = gridStroke;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        for (let y = 0; y <= height; y += step) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();

        pulseAngle += 0.012;
        const focalX = pointer.active ? pointer.x : width * 0.5 + Math.cos(pulseAngle) * (width * 0.28);
        const focalY = pointer.active ? pointer.y : height * 0.45 + Math.sin(pulseAngle * 0.8) * (height * 0.25);
        const connectDist = isMobile ? 120 : 155;
        const focalDist = isMobile ? 155 : 210;

        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          n.x += n.vx;
          n.y += n.vy;

          if (n.x < 0 || n.x > width) n.vx *= -1;
          if (n.y < 0 || n.y > height) n.vy *= -1;

          ctx.fillStyle = n.isMajor ? majorNodeFill : nodeFill;
          ctx.fillRect(n.x - n.size / 2, n.y - n.size / 2, n.size, n.size);

          for (let j = i + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const dist = Math.hypot(n.x - n2.x, n.y - n2.y);
            if (dist < connectDist) {
              const alpha = (1 - dist / connectDist) * (isDark ? 0.26 : 0.22);
              ctx.strokeStyle = isDark ? `rgba(242, 242, 238, ${alpha})` : `rgba(17, 17, 17, ${alpha})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(n.x, n.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.stroke();
            }
          }

          const fdist = Math.hypot(n.x - focalX, n.y - focalY);
          if (fdist < focalDist) {
            const fAlpha = (1 - fdist / focalDist) * (pointer.active ? 0.72 : 0.4);
            ctx.strokeStyle = `rgba(217, 43, 43, ${fAlpha})`;
            ctx.lineWidth = pointer.active && fdist < (focalDist * 0.45) ? 1.5 : 1;
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(focalX, focalY);
            ctx.stroke();
          }
        }

        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
